[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "angebote-cli"
version = "0.1.0"
description = "CLI für aktuelle Prospekt-Angebote deutscher Händler über kaufDA.de"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "smlfg", email = "186922365+smlfg@users.noreply.github.com" },
]
dependencies = [
    "httpx>=0.24",
]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
angebote = "angebote_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
